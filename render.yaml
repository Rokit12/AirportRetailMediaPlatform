# Render blueprint: New + > Blueprint > point at this repo. Free plan works; the demo seeds itself on boot.
services:
  - type: web
    name: airportretailmediaplatform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /tmp/gateline.db
      - key: AI_PROVIDER
        value: mock
