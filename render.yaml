# Render blueprint: New + > Blueprint > point at this repo. Free plan works; the demo seeds itself on boot.
services:
  - type: web
    name: gateline-playground
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://gateline-playground.onrender.com   # set to your service URL so QR codes open on phones
      - key: DB_PATH
        value: /tmp/gateline.db
      - key: AI_PROVIDER
        value: mock
